# Throwaway OpenClaw sandbox for the Cerebras x Kimi Speed Bounty.
# All state lives in ./state; `./oc nuke` removes container + state.
services:
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:2026.11.6-browser}
    container_name: openclaw
    init: false            # image already runs tini
    env_file: .env
    environment:
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_BROWSER_HEADLESS: "1"
      TZ: Asia/Kolkata
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    ports:
      - "127.0.0.1:18789:18789"   # Control UI, localhost only
    volumes:
      - ./state:/home/node/.openclaw
    shm_size: 1gb                 # Chromium needs more than the 64MB default
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on: [tpsproxy, searxng]

  # Logs real per-reply TPS (OpenClaw -> tpsproxy -> api.cerebras.ai) to ./logs/tps.jsonl
  # and serves the live dashboard.
  tpsproxy:
    image: python:3.13-slim
    container_name: tpsproxy
    user: "1000:1000"
    command: ["python", "-u", "/app/proxy.py"]
    ports:
      - "127.0.0.1:8081:8080"   # live TPS dashboard: http://127.0.0.1:8081/
    volumes:
      - ./tpsproxy:/app:ro
      - ./logs:/logs
    restart: unless-stopped

  # Keyless meta-search backend for OpenClaw's web_search (internal only, no host port).
  searxng:
    image: searxng/searxng:2026.11.21-c6ee3e9fd
    container_name: searxng
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
